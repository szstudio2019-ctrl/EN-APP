<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>עריכת הסבר על האתר – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261108t">
  <link rel="stylesheet" href="admin-edit.css?v=20261108t">
</head>
<body class="a-body" data-page="content" data-sub="intro">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>הסבר על האתר</h1>
        <p>החלון שנפתח לילדים בכניסה הראשונה: השקופיות, הכותרות והטקסטים.</p>
      </div>
    </div>
    <div class="a-note" style="margin-bottom:24px">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      <p>בשלב הזה השינויים נשמרים בדפדפן הזה בלבד. כשהאתר יחובר לשרת, הם יופיעו לכל התלמידים.</p>
    </div>
    <div class="t-layout">
      <div class="t-form" id="t-form"></div>
      <aside class="t-side a-card" aria-label="תצוגה מקדימה">
        <h2 class="t-side__title">כך זה נראה לילדים</h2>
        <div id="t-preview"></div>
      </aside>
    </div>
  </main>
  <script>
    window.TEXT_PAGE = {
      key: 'intro',
      slideTabs: true,
      defaults: {
        slides: [
          { title: 'ברוכים הבאים,', pink: '[שם הילד/ה]', text: 'הגעתם למדקדקים באנגלית\nתוכלו ללמוד אנגלית בכיף.' },
          { title: 'שלבי המשחק', pink: '', text: 'במשחק יש [מספר האיים] איים בכל אי כמה שלבים +\nאיי חזרות' },
          { title: 'בונוסים מ', pink: 'החזרות והתמדה', text: 'כל כמה שלבים שיהיו לך שלבי חזרה על החומר\nבהם תוכלי לצבור כמות גדולה של מטבעות בתיבות' },
          { title: 'משחק הגרלת', pink: 'המשפטים', text: 'בכל משחק תוכלי להגריל משפט ולקנות\nאותיות מחנות האותיות מהמטבעות שתצברי במשחק.' },
        ],
        sTitle: 'משחק הגרלת', sPink: 'המשפטים',
        sNew: 'הוגרל לך משפט חדש!\nקני אותיות בחנות האותיות כדי לגלות אותו',
        sGoing: 'זה המשפט שלך – נשארו [מספר] אותיות לגלות. ממשיכים עם אותו משפט עד שמגלים את כולו.\nקני אותיות בחנות האותיות!',
        sDone: 'סיימת את המשפט הקודם! הגרילי משפט חדש',
        sNone: 'אין לך משפט פעיל כרגע – הגרילי משפט חדש ותתחילי לגלות אותו!',
      },
      sections: [
        { list: 'slides', title: 'השקופיות', itemName: 'שקופית', note: 'הסדר כאן הוא סדר השקופיות. מה שבסוגריים מרובעים מתמלא לבד (השם של הילד/ה, מספר האיים).',
          fields: [{ key: 'title', label: 'כותרת' }, { key: 'pink', label: 'המשך הכותרת בוורוד' }, { key: 'text', label: 'טקסט', long: true }, { key: 'img', label: 'תמונה בשקופית', image: true }] },
        { id: 'sentence', title: 'כרטיס משחק המשפטים', tab: 'כרטיס המשפטים', note: 'מופיע אחרי השקופיות, ובכל כניסה מהשנייה ואילך.',
          fields: [{ key: 'sTitle', label: 'כותרת' }, { key: 'sPink', label: 'המשך הכותרת בוורוד' },
            { key: 'sNew', label: 'כשהוגרל משפט חדש', long: true }, { key: 'sGoing', label: 'כשיש משפט בתהליך', long: true },
            { key: 'sDone', label: 'כשהמשפט הושלם', long: true }, { key: 'sNone', label: 'כשאין משפט', long: true }] },
      ],
      preview: (d, esc) => {
        const n = d.slides.length;
        const at = Math.min(window.__pv || 0, n);
        const s = at < n ? d.slides[at] : { title: d.sTitle, pink: d.sPink, text: d.sNew };
        return `<div class="pv-plain">
            ${s.img ? `<img class="pv__img" src="${s.img}" alt="">` : ''}
            <p class="pv__title">${esc(s.title)} <span class="pv__pink">${esc(s.pink)}</span></p>
            <p class="pv__text">${esc(s.text)}</p>
            ${at < n ? `<div class="pv__dots">${d.slides.map((_, k) => `<i class="${k === at ? 'is-on' : ''}"></i>`).join('')}</div>` : ''}
          </div>`;
      },
    };
  </script>
  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261108t"></script>
  <script src="admin-texts.js?v=20261108t"></script>
</body>
</html>
