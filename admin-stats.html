<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>התמדה – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261110a">
  <link rel="stylesheet" href="admin-stats.css?v=20261110a">
</head>
<body class="a-body" data-page="stats">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>התמדה</h1>
        <p>כמה הילדים משחקים, כמה מטבעות צברו ומי מתמיד/ה במיוחד.</p>
      </div>
      <div class="st-filters">
        <span id="s-period"></span>
        <span id="s-who"></span>
        <span id="s-grade"></span>
      </div>
    </div>

    <section>
      <div class="st-cols">
        <div class="st-col st-col--main">
          <div class="a-card st-box">
            <h2 class="st-col__title">התמדה כללית</h2>
            <div class="st-tiles" id="s-tiles"></div>
          </div>
          <div class="a-card st-box" id="s-podium"></div>
          <div class="a-card st-box st-box--chart">
            <h2 class="st-col__title" id="s-chart-title">כמה דקות שיחקו בכל יום</h2>
            <div class="a-chart" id="s-chart"></div>
          </div>
        </div>
        <div class="st-col a-card st-box st-box--list">
          <h2 class="st-col__title">התמדה לפי ילד</h2>
          <ul class="st-list" id="s-rank"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="islands.js"></script>
  <script src="child-stats.js?v=20261110a"></script>
  <script src="admin-shell.js?v=20261110a"></script>
  <script src="admin-stats.js?v=20261110a"></script>
</body>
</html>
