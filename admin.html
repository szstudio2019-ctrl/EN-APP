<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>משתמשים – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Fredoka:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css">
  <script>
    // the old "נתוני התמדה" link (admin.html#stats) now has its own page
    if (location.hash === '#stats') location.replace('admin-stats.html');
  </script>
</head>
<body class="a-body" data-page="users">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>משתמשים</h1>
        <p>כל התלמידים, פרטי המנוי והאם הם פעילים.</p>
      </div>
      <button class="a-btn a-btn--primary" type="button" id="u-add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>הוספת משתמש
      </button>
    </div>

    <section class="a-card" aria-label="רשימת המשתמשים">
      <div class="a-filters">
        <div id="u-filter"></div>
        <label class="a-field" style="flex:1;min-width:220px;max-width:420px">
          <span class="sr-only">חיפוש</span>
          <input type="search" id="u-search" placeholder="חיפוש לפי שם, משתמש, טלפון או אימייל">
        </label>
      </div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead>
            <tr><th>משתמש</th><th>שם משתמש</th><th>טלפון</th><th>אימייל</th><th>הרשמה</th><th>המנוי פג</th><th>פעיל</th><th>פעולות</th></tr>
          </thead>
          <tbody id="u-rows"></tbody>
        </table>
      </div>
      <p class="a-muted" id="u-empty" hidden style="text-align:center;padding:32px 0;margin:0">לא נמצאו משתמשים</p>
      <p class="a-small a-muted" style="margin:16px 0 0">🏆 מצטיינים – שיחקו ברוב הימים בחודש האחרון · 🏅 מתמידים – משתדלים לשחק באופן קבוע</p>
    </section>
  </main>

  <!-- add / edit a user -->
  <div class="a-dialog" id="u-dialog" role="dialog" aria-modal="true" aria-labelledby="u-dialog-title" hidden>
    <form class="a-dialog__card" id="u-form">
      <div class="a-dialog__head">
        <h2 id="u-dialog-title">משתמש חדש</h2>
        <button class="a-icon-btn" type="button" id="u-close" aria-label="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="a-grid">
        <label class="a-field"><span>שם פרטי</span><input id="f-first" required></label>
        <label class="a-field"><span>שם משפחה</span><input id="f-last"></label>
        <label class="a-field"><span>שם משתמש</span><input id="f-user" dir="ltr" required></label>
        <label class="a-field"><span>טלפון</span><input id="f-phone" type="tel" dir="ltr"></label>
        <label class="a-field a-wide"><span>אימייל</span><input id="f-email" type="email" dir="ltr"></label>
        <label class="a-field"><span>תאריך הרשמה</span><input id="f-start" type="date" required></label>
        <label class="a-field"><span>המנוי פג בתאריך</span><input id="f-end" type="date" required><small class="a-help">חודש לפני התאריך המשתמש יופיע ב"המנוי פג בקרוב"</small></label>
      </div>
      <label class="a-switch" style="margin-top:12px"><input type="checkbox" id="f-active" checked><span class="a-switch__track" aria-hidden="true"></span><span>משתמש פעיל</span></label>
      <div class="a-dialog__foot">
        <button class="a-btn a-btn--primary" type="submit" id="f-submit">הוספה</button>
        <button class="a-btn a-btn--ghost" type="button" id="f-cancel">ביטול</button>
      </div>
    </form>
  </div>

  <script src="islands.js"></script>
  <script src="child-stats.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-users.js"></script>
</body>
</html>
