<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אי הרופא/ה – אנימציה</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f8c3dd, #9cc7ff);
    }

    /* The animation box. Change the width; the height follows the clip's ratio. */
    .doctor {
      position: relative;
      width: min(560px, 90vw);
      aspect-ratio: 678 / 602;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
    }
    .doctor video,
    .doctor img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .doctor:focus-visible { outline: 3px solid #e33563; outline-offset: 6px; border-radius: 12px; }
  </style>
</head>
<body>

  <!--
    At rest it shows the first frame. Hovering plays the animation silently;
    clicking restarts it once with the "Ahhh" sound.
    - Chrome / Edge / Firefox: transparent WebM (the sound is inside it)
    - Safari / iPhone: animated WebP + a separate WAV for the sound
    Files: island-doctor-first.webp, island-doctor-ahh.webm,
           island-doctor-ahh.webp, doctor-ahh.wav
  -->
  <button class="doctor" id="doctor" type="button" aria-label="הרופאה אומרת אהההה – לחצו לשמוע">
    <img id="doctor-still" src="../assets/island-doctor-first.webp" alt="">
    <video id="doctor-video" src="../assets/island-doctor-ahh.webm" muted loop playsinline preload="auto" hidden></video>
  </button>

  <script>
    (function () {
      const box = document.getElementById('doctor');
      const still = document.getElementById('doctor-still');
      const video = document.getElementById('doctor-video');

      // Transparent WebM works in Chromium and Firefox; Safari shows a black box,
      // so it gets the animated WebP instead.
      const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);

      if (!isSafari) {
        const show = () => { video.hidden = false; still.hidden = true; };
        const rest = () => { video.pause(); video.currentTime = 0; video.muted = true; video.hidden = true; still.hidden = false; };
        box.addEventListener('mouseenter', () => { video.muted = true; video.play().then(show); });
        box.addEventListener('mouseleave', rest);
        // the sound plays for one pass only: mute again when the loop wraps to the start
        let underway = false;
        video.addEventListener('timeupdate', () => {
          if (video.muted) return;
          if (video.currentTime > 1) underway = true;
          else if (underway && video.currentTime < 0.5) { video.muted = true; underway = false; }
        });
        box.addEventListener('click', () => {
          underway = false;
          video.currentTime = 0;
          video.muted = false;
          video.play().then(show);
        });
        return;
      }

      // Safari / iPhone fallback: swap the still for the animated WebP while hovering
      const sound = new Audio('../assets/doctor-ahh.wav');
      const play = () => { still.src = '../assets/island-doctor-ahh.webp?' + Date.now(); };
      const rest = () => { still.src = '../assets/island-doctor-first.webp'; sound.pause(); };
      box.addEventListener('mouseenter', play);
      box.addEventListener('mouseleave', rest);
      box.addEventListener('click', () => { play(); sound.currentTime = 0; sound.play(); });
    })();
  </script>
</body>
</html>
