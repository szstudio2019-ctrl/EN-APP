<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>עריכת משפטי הגרלה – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261123f">
  <link rel="stylesheet" href="admin-edit.css?v=20261123a">
</head>
<body class="a-body" data-page="content" data-sub="raffle">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>משפטי הגרלה</h1>
        <p>המשפטים שהילדים מגרילים בחנות האותיות. אפשר להוסיף כמה יחד, לערוך ולהעביר לארכיון.</p>
      </div>
    </div>
    <section class="a-card s-newcard" aria-labelledby="s-new-title">
      <h2 class="t-h" id="s-new-title">הוספת משפטים</h2>
      <form class="s-add" id="s-new" novalidate>
        <label class="a-field"><span>משפטים חדשים באנגלית – שורה לכל משפט</span>
          <textarea id="s-lines" rows="4" dir="ltr" lang="en" placeholder="You can do it!&#10;Believe in yourself!"></textarea></label>
        <ul class="s-pre" id="s-pre" aria-live="polite"></ul>
        <div class="s-add__foot">
          <p class="s-add__msg" id="s-msg" role="status"></p>
          <button class="a-btn a-btn--primary" type="submit" id="s-add-btn" disabled>הוספת משפט</button>
        </div>
      </form>
    </section>
    <section class="a-card" aria-labelledby="s-list-title">
      <h2 class="t-h" id="s-list-title">רשימת המשפטים</h2>
      <div class="s-tools">
        <div id="s-tabs"></div>
        <label class="a-search" id="s-search-box" style="flex:0 1 260px"><span class="sr-only">חיפוש משפט</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="s-search" placeholder="חיפוש משפט" style="border-radius:999px"></label>
      </div>
      <ol class="s-list" id="s-list"></ol>
    </section>
  </main>
  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261122w"></script>
  <script>
    (function () {
      const { UI } = window.Admin;
      const KEY = 'en-app:admin-sentences';
      // a sentence with more different letters than this gets a warning (it is hard to fill in the shop)
      const MAX_LETTERS = 16;
      const POOL = [
        ['You can do it!', 'אתה יכול לעשות את זה!'], ['Believe in yourself!', 'תאמין בעצמך!'], ['You are amazing!', 'אתה מדהים!'],
        ['Your best is enough.', 'הכי טוב שלך זה מספיק.'], ['Mistakes help you grow.', 'טעויות עוזרות לך לצמוח.'], ['Never give up!', 'לעולם אל תוותר!'],
        ['Every day is a fresh start.', 'כל יום הוא התחלה חדשה.'], ['Practice makes progress.', 'תרגול מביא התקדמות.'], ['Dream big!', 'חלום בגדול!'],
        ['Keep shining!', 'תמשיך להאיר!'], ['Be brave!', 'תהיה אמיץ!'], ['Choose to be kind.', 'בחר להיות נחמד.'],
      ].map(([en, he]) => ({ en, he }));
      let cur;
      try { cur = JSON.parse(localStorage.getItem(KEY)); } catch (e) { cur = null; }
      if (!Array.isArray(cur)) cur = POOL;
      // demo: a few sentences already moved to the archive (added once)
      const DAY = 24 * 60 * 60 * 1000;
      const ARCHIVED_DEMO = [['Reading is fun!', 3], ['Smile every day.', 9], ['You are a star!', 21], ['Learning is a gift.', 40]];
      let demoDone = false;
      try { demoDone = localStorage.getItem('en-app:admin-sentences-arch-demo') === '1'; } catch (e) { /* blocked */ }
      if (!demoDone) {
        const have = new Set(cur.map((x) => String(x.en).trim().toLowerCase()));
        ARCHIVED_DEMO.forEach(([en, ago]) => { if (!have.has(en.toLowerCase())) cur.push({ en, archived: true, archivedAt: new Date(Date.now() - ago * DAY).toISOString() }); });
        try { localStorage.setItem(KEY, JSON.stringify(cur)); localStorage.setItem('en-app:admin-sentences-arch-demo', '1'); } catch (e) { /* blocked */ }
      }
      // every change is kept straight away (a translation already in the data stays there untouched)
      const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) { /* blocked */ } };
      const $ = (id) => document.getElementById(id);
      const list = $('s-list');
      const search = $('s-search');
      const letters = (t) => new Set(String(t).toLowerCase().replace(/[^a-z]/g, '')).size;
      const norm = (t) => String(t).trim().replace(/\s+/g, ' ').toLowerCase();
      const fmt = (d) => new Date(d).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
      const ICON = {
        // the same trash icon as the islands page (it moves the sentence to the archive)
        archive: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/></svg>',
        back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-5-5 5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
        warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17v.5"/></svg>',
      };
      let tab = 'active';

      /* ---------- adding several at once, with a live preview ---------- */
      const lines = () => $('s-lines').value.split('\n').map((l) => l.trim().replace(/\s+/g, ' ')).filter(Boolean);
      function preview() {
        const have = new Set(cur.map((s) => norm(s.en)));
        const seen = new Set();
        const items = lines().map((en) => {
          const k = norm(en);
          const dup = have.has(k) || seen.has(k);
          seen.add(k);
          return { en, n: letters(en), dup, long: letters(en) > MAX_LETTERS };
        });
        $('s-pre').innerHTML = items.map((it) => `<li class="s-pre__row${it.dup ? ' is-dup' : ''}">
            <span class="s-pre__en" dir="ltr" lang="en">${UI.esc(it.en)}</span>
            <span class="s-pre__n">${it.n} אותיות שונות</span>
            ${it.dup ? `<span class="s-flag">${ICON.warn}כבר ברשימה – לא יתווסף</span>` : ''}
            ${it.long ? `<span class="s-flag">${ICON.warn}ארוך מדי (מעל ${MAX_LETTERS} אותיות שונות)</span>` : ''}
          </li>`).join('');
        const n = items.filter((it) => !it.dup).length;
        const btn = $('s-add-btn');
        btn.disabled = !n;
        btn.textContent = n > 1 ? `הוספת ${n} משפטים` : 'הוספת משפט';
        return items;
      }
      $('s-lines').addEventListener('input', () => { $('s-msg').textContent = ''; preview(); });
      $('s-new').addEventListener('submit', (e) => {
        e.preventDefault();
        const items = preview();
        const add = items.filter((it) => !it.dup);
        const skipped = items.length - add.length;
        if (!add.length) return;
        // each line is its own sentence
        add.forEach((it) => cur.push({ en: it.en, archived: false }));
        save();
        $('s-lines').value = '';
        search.value = '';
        tab = 'active';
        preview(); draw();
        $('s-msg').textContent = `${add.length === 1 ? 'נוסף משפט אחד' : `נוספו ${add.length} משפטים`}${skipped ? ` · ${skipped} כפולים לא נוספו` : ''}`;
        $('s-lines').focus();
      });

      /* ---------- the list: active / archive ---------- */
      function draw() {
        const active = cur.map((s, i) => [s, i]).filter(([s]) => !s.archived);
        const archived = cur.map((s, i) => [s, i]).filter(([s]) => s.archived);
        $('s-tabs').innerHTML = UI.segHtml('משפטים פעילים וארכיון', [['active', 'פעילים', active.length], ['archive', 'ארכיון', archived.length]], tab);
        $('s-search-box').hidden = tab !== 'active';
        if (tab === 'archive') {
          list.innerHTML = archived.length ? archived.map(([s, i], k) => `<li class="s-row s-row--arch">
              <span class="s-row__n">${k + 1}</span>
              <span class="s-row__text" dir="ltr" lang="en">${UI.esc(s.en)}</span>
              <span class="s-row__meta">בארכיון מ־${s.archivedAt ? fmt(s.archivedAt) : '—'}</span>
              <button class="a-btn a-btn--ghost s-back" type="button" data-back="${i}">${ICON.back}החזרה להגרלה</button>
            </li>`).join('') : '<li class="s-empty">אין משפטים בארכיון</li>';
          return;
        }
        // the search works on the active ones
        const q = search.value.trim().toLowerCase();
        const rows = active.map(([s, i], k) => [s, i, k]).filter(([s]) => !q || s.en.toLowerCase().includes(q));
        list.innerHTML = rows.length ? rows.map(([s, i, k]) => `<li class="s-row">
            <span class="s-row__n">${k + 1}</span>
            <span class="s-row__edit"><input data-en="${i}" dir="ltr" lang="en" value="${UI.esc(s.en)}" size="${Math.max(10, s.en.length + 2)}" aria-label="משפט ${k + 1}"><span class="s-saved" data-saved="${i}" role="status"></span></span>
            <span class="s-row__meta" data-meta="${i}">${letters(s.en)} אותיות שונות</span>
            <button class="t-round s-arch" type="button" data-arch="${i}" aria-label="העברה לארכיון: ${UI.esc(s.en)}" title="העברה לארכיון">${ICON.archive}</button>
          </li>`).join('') : `<li class="s-empty">${q ? 'לא נמצאו משפטים' : 'אין משפטים פעילים'}</li>`;
      }
      UI.wireSeg($('s-tabs'), (k) => { tab = k; draw(); });
      search.addEventListener('input', draw);
      // editing in the row: the letters count follows as you type; kept when leaving the field, with "נשמר ✓"
      list.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.en == null) return;
        list.querySelector(`[data-meta="${t.dataset.en}"]`).textContent = `${letters(t.value)} אותיות שונות`;
        t.size = Math.max(10, t.value.length + 2);
      });
      list.addEventListener('focusout', (e) => {
        const t = e.target;
        if (t.dataset.en == null) return;
        const i = Number(t.dataset.en);
        const v = t.value.trim().replace(/\s+/g, ' ');
        // an emptied sentence goes back to what it was
        if (!v) { t.value = cur[i].en; list.querySelector(`[data-meta="${i}"]`).textContent = `${letters(cur[i].en)} אותיות שונות`; return; }
        if (v === cur[i].en) return;
        cur[i].en = v; t.value = v; save();
        const ok = list.querySelector(`[data-saved="${i}"]`);
        ok.textContent = 'נשמר ✓';
        clearTimeout(ok._t); ok._t = setTimeout(() => { ok.textContent = ''; }, 1800);
      });
      list.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.en != null) e.target.blur(); });
      list.addEventListener('click', (e) => {
        const a = e.target.closest('[data-arch]');
        if (a) { const s = cur[a.dataset.arch]; s.archived = true; s.archivedAt = new Date().toISOString(); save(); draw(); return; }
        const b = e.target.closest('[data-back]');
        if (b) { const s = cur[b.dataset.back]; s.archived = false; delete s.archivedAt; save(); draw(); }
      });
      preview();
      draw();
    })();
  </script>
</body>
</html>
