<!doctype html><meta charset="utf-8"><video id="v" src="src.mp4" muted playsinline preload="auto"></video>
<script>
// the clef's bright pixels in its area, frame by frame: its bounding box
window.measure = async () => {
  const v = document.getElementById('v');
  await new Promise((r) => (v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true })));
  const R = { x: 480, y: 120, w: 340, h: 380 };
  const c = document.createElement('canvas'); c.width = R.w; c.height = R.h; const x = c.getContext('2d', { willReadFrequently: true });
  const out = [];
  for (let t = 0; t <= 10; t += 0.5) {
    v.currentTime = Math.min(t, v.duration - 0.05);
    await new Promise((r) => v.addEventListener('seeked', r, { once: true }));
    x.drawImage(v, R.x, R.y, R.w, R.h, 0, 0, R.w, R.h);
    const d = x.getImageData(0, 0, R.w, R.h).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, n = 0;
    for (let yy = 0; yy < R.h; yy++) for (let xx = 0; xx < R.w; xx++) {
      const i = (yy * R.w + xx) * 4; const r = d[i], g = d[i + 1], b = d[i + 2];
      if (r > 150 && g > 190 && b > 220) { n++; if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
    }
    out.push([t, n, x0 + R.x, y0 + R.y, x1 + R.x, y1 + R.y]);
  }
  return out;
};
</script>
