<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השמעות הזברה</title>
<style>
  :root {
    /* whole page dark navy; only the recording cards are light */
    --bg: #0f1d3a; --panel: #13254a; --side: #0b1730; --ink: #e8eefc; --muted: #8fa3c8;
    --line: #23396a; --accent: #ff6b9b; --accent-soft: #2a3f73; --hover: #1a2f5c; --dim: #5d73a0;
    --card: #ffffff; --card-ink: #13254a; --card-line: #dfe6f5; --card-playing: #ffe8f0;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 2; }
  .brand { padding: 16px 18px 10px; }
  .brand h1 { margin: 0; font-size: 19px; }
  .brand small { color: var(--muted); }
  .search { margin: 0 14px 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; }
  nav { overflow: auto; padding: 0 8px 20px; flex: 1; }
  nav a { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 9px; color: var(--ink); text-decoration: none; }
  nav a:hover { background: var(--hover); }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a span { color: var(--muted); font-size: 12px; }
  nav a.side-folder { color: var(--dim); font-style: italic; }
  main { margin-right: 280px; padding: 10px 28px 110px; }
  section.island { padding-top: 14px; }
  section.island > h2 { position: sticky; top: 0; z-index: 1; margin: 0 -28px 6px; padding: 12px 28px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 22px; }
  .area { margin: 18px 0 6px; }
  .area-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .area-head h3 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 600; }
  .area-head .n { color: var(--muted); font-size: 12px; }
  .area.side-folder .area-head h3 { color: var(--dim); font-style: italic; }
  .area.syl { margin-top: 10px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 14px; background: rgba(255,107,155,.06); }
  .area.syl .area-head h3 { color: var(--accent); }
  .area-head button { margin-right: auto; font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .area-head button:hover { border-color: var(--accent); color: var(--accent); }
  .area-head button.seq { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 5px 14px; }
  .area-head button.seq:hover { filter: brightness(1.1); color: #fff; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .file { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); color: var(--card-ink); border: 1px solid var(--card-line); border-radius: 12px; padding: 7px 10px 7px 7px; cursor: pointer; }
  .file:hover { border-color: var(--accent); }
  .file.playing { border-color: var(--accent); background: var(--card-playing); }
  .file .pb { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; font-size: 12px; }
  .file .fn { direction: ltr; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: 600; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); padding: 30px 0; }
  .player { position: fixed; bottom: 0; left: 0; right: 280px; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 24px; display: flex; gap: 14px; align-items: center; z-index: 3; }
  .player .now { min-width: 0; flex: 0 1 340px; }
  .player .now b { display: block; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .now span { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player audio { flex: 1; min-width: 0; }
  .player button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  /* the moving zebra, on its own white card next to the player – moves only while a recording plays */
  .zebra { position: fixed; left: 24px; bottom: 74px; width: 170px; height: 210px; background: #fff; border-radius: 18px; border: 3px solid var(--accent); overflow: hidden; z-index: 3; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .zebra video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  main { padding-left: 220px; }
  /* "הזברות" – every zebra video, on white cards */
  .zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .zcard { background: #fff; color: var(--card-ink); border-radius: 14px; border: 1px solid var(--card-line); padding: 8px; text-align: center; }
  .zcard video { width: 100%; height: 200px; object-fit: contain; mix-blend-mode: multiply; display: block; }
  .zcard b { display: block; font-size: 14px; margin-top: 4px; }
  .zcard .zrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; text-align: right; }
  .zcard .zplay { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; flex: none; }
  .zcard.playing { border-color: var(--accent); background: var(--card-playing); }
  .zcard small { display: block; direction: ltr; color: #6b7a99; font-size: 11px; }
  nav a.zebras-link { color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--line); border-radius: 9px 9px 0 0; margin-bottom: 4px; }
  @media (max-width: 760px) {
    .zebra { left: 10px; bottom: 120px; width: 110px; height: 136px; }
    main { padding-left: 16px; }
    aside { position: static; width: auto; border-left: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    main { margin-right: 0; padding: 10px 16px 130px; }
    section.island > h2 { margin: 0 -16px 6px; padding: 10px 16px; }
    .player { right: 0; padding: 8px 16px; flex-wrap: wrap; }
    .player .now { flex-basis: 100%; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>🦓 השמעות הזברה</h1><small id="stats"></small></div>
  <input class="search" id="q" type="search" placeholder="חיפוש הקלטה (cat, sentence, A)…">
  <nav id="menu"></nav>
</aside>
<main id="main"></main>
<div class="zebra" aria-hidden="true"><video id="zebra" muted loop playsinline preload="auto"></video></div>
<div class="player">

  <audio id="audio" controls preload="none"></audio>
  <button id="stop">■ עצור</button>
</div>

  // recordings with syllables (<word>-syllables) get their own area under the regular words
  const side = trail.some(t => SIDE.test(t));
  const syl = node.files.filter(f => /-syllables/i.test(f.name));
  const reg = node.files.filter(f => !syl.includes(f));
  if (reg.length) out.push({ title: trail.join(' › '), files: reg, side });
  if (syl.length) out.push({ title: trail.join(' › '), sub: 'מילים בהברות', files: syl, side, syl: true });
  node.dirs.forEach(d => areas(d, trail.concat(d.name), out));
  return out;
}

// which island each zebra video belongs to
const ZNAMES = { 'zebra-detective-idle': 'זיהוי האותיות (בלשית)', 'zebra-doctor-loop2': 'האותיות של הרופאה', 'zebra-smiles-i': 'האותיות המחייכות', 'zebra-smiles-i-idle': 'האותיות המחייכות – עומדת', 'zebra-single-idle2': 'האותיות הבודדות', 'zebra-blending-idle': 'צירופי האותיות', 'zebra-whistling-idle': 'האותיות השורקות', 'zebra-magic-idle': 'הקסמים', 'zebra-sounds-idle': 'האותיות המיוחדות', 'zebra-review-coach': 'אי החזרות – המאמנת', 'zebra-review-idle': 'אי החזרות – עומדת' };
(function zebrasArea() {
  const list = DATA.zebras || [];
  if (!list.length) return;
  const a = document.createElement('a');
  a.href = '#zebras'; a.className = 'zebras-link';
  a.innerHTML = '<b>🦓 הזברות</b><span></span>';
  a.querySelector('span').textContent = list.length;
  $('menu').appendChild(a);
  const sec = document.createElement('section');
  sec.className = 'island'; sec.id = 'zebras';
  sec.innerHTML = '<h2>🦓 הזברות</h2><div class="zgrid"></div>';
  const grid = sec.querySelector('.zgrid');
  list.forEach(n => {
    const c = document.createElement('div');
    c.className = 'zcard';
    c.innerHTML = '<video muted loop playsinline preload="metadata"></video><div class="zrow"><div><b></b><small></small></div><button class="zplay" aria-label="נגן">▶</button></div>';
    const v = c.querySelector('video'), btn = c.querySelector('.zplay');
    v.src = 'assets/' + n + '#t=0.1';
    const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
    btn.onclick = toggle; v.onclick = toggle;
    v.onplay = () => { btn.textContent = '❚❚'; c.classList.add('playing'); };
    v.onpause = () => { btn.textContent = '▶'; c.classList.remove('playing'); };
    c.querySelector('b').textContent = ZNAMES[n.replace(/.[^.]+$/, '')] || n;
    c.querySelector('small').textContent = n;
    grid.appendChild(c);
  });
  $('main').appendChild(sec);
})();
const islands = DATA.dirs.slice();
if (DATA.files.length) islands.unshift({ name: 'קבצים כלליים', rel: '', files: DATA.files, dirs: [], total: DATA.files.length });

const main = $('main'), menu = $('menu'), cards = [];
islands.forEach((isl, i) => {
  const id = 'island-' + i;
  const a = document.createElement('a');
  a.href = '#' + id;
  a.innerHTML = '<b></b><span></span>';
  a.querySelector('b').textContent = isl.name;
  a.querySelector('span').textContent = isl.total;
  if (SIDE.test(isl.name)) a.classList.add('side-folder');
  menu.appendChild(a);

  const sec = document.createElement('section');
  sec.className = 'island'; sec.id = id;
  const h2 = document.createElement('h2');
  h2.textContent = isl.name;
  sec.appendChild(h2);
  const list = areas({ files: isl.files, dirs: isl.dirs }, [], []);
  if (!list.length) sec.insertAdjacentHTML('beforeend', '<div class="empty">אין הקלטות באי הזה עדיין.</div>');
  list.forEach(ar => {
    const box = document.createElement('div');
    box.className = 'area' + (ar.side ? ' side-folder' : '') + (ar.syl ? ' syl' : '');
    box.innerHTML = '<div class="area-head"><h3></h3><span class="n"></span><button class="seq">▶ השמע ברצף</button></div><div class="files"></div>';
    box.querySelector('h3').textContent = ar.syl ? '🔤 ' + ar.sub + ' – ' + (ar.title || isl.name) : (ar.title || isl.name);
    box.querySelector('.n').textContent = ar.files.length + ' הקלטות';
    box.querySelector('button').onclick = () => { queue = ar.files; qi = 0; play(); };
    const grid = box.querySelector('.files');
    ar.files.forEach((f, j) => {
      const d = document.createElement('div');
      d.className = 'file';
      d.dataset.rel = f.rel;
      d.title = f.name;
      d.innerHTML = '<div class="fn"></div><div class="pb">▶</div>';
      d.querySelector('.fn').textContent = strip(f.name);
      d.onclick = () => { queue = [f]; qi = 0; play(); }; // a card plays only itself
      grid.appendChild(d);
      cards.push({ el: d, box, sec, key: f.rel.toLowerCase() });
    });
    sec.appendChild(box);
  });
  main.appendChild(sec);
});

function play() {
  const f = queue[qi];
  if (!f) return;
  audio.src = url(f.rel);
  const z = zebraFor(f.rel);
  if (!zebra.src.endsWith(z)) zebra.src = z;
  audio.play();
  $('nowName').textContent = f.name;
  $('nowPath').textContent = f.rel.split('/').slice(0, -1).join(' › ');
  document.querySelectorAll('.file.playing').forEach(e => e.classList.remove('playing'));
  const el = document.querySelector(`.file[data-rel="${CSS.escape(f.rel)}"]`);
  if (el) el.classList.add('playing');
}
audio.addEventListener('play', () => zebra.play().catch(() => {}));
audio.addEventListener('pause', () => zebra.pause());
zebra.src = 'assets/zebra-review-idle.webm';
audio.addEventListener('ended', () => { if (qi < queue.length - 1) { qi++; play(); } });
$('stop').onclick = () => { audio.pause(); audio.currentTime = 0; queue = []; qi = -1; document.querySelectorAll('.file.playing').forEach(e => e.classList.remove('playing')); };

// highlight the island in view
const links = [...menu.querySelectorAll('a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));
}), { rootMargin: '0px 0px -70% 0px' });
document.querySelectorAll('section.island').forEach(s => io.observe(s));

// search filters the cards in place
$('q').addEventListener('input', () => {
  const q = $('q').value.trim().toLowerCase();
  cards.forEach(c => c.el.classList.toggle('hidden', !!q && !c.key.includes(q)));
  document.querySelectorAll('.area').forEach(b => b.classList.toggle('hidden', !!q && !b.querySelector('.file:not(.hidden)')));
  document.querySelectorAll('section.island').forEach(s => s.classList.toggle('hidden', !!q && !s.querySelector('.file:not(.hidden)')));
});
</script>
</body>
