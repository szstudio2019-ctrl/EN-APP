<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>הגדרות מטבעות – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261109i">
  <style>
    .c-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .c-section h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; color: #E33563; }
    .c-side { display: grid; gap: 24px; }
    .c-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .c-item { display: flex; align-items: center; gap: 16px; min-height: 96px; padding: 18px 20px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(42, 37, 97, .05), 0 0 0 1px var(--a-line); }
    .c-icon { flex: none; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #F4F3FA; }
    .c-icon img { width: 36px; height: 36px; object-fit: contain; }
    .c-icon svg { width: 26px; height: 26px; }
    .c-text { flex: 1; min-width: 0; }
    .c-text b { display: block; font-size: 17px; font-weight: 600; color: #232A6B; }
    .c-text span { font-size: 14px; color: var(--a-text-2); }
    .c-val { display: flex; align-items: center; gap: 10px; flex: none; }
    .c-unit { font-size: 14px; font-weight: 500; color: var(--a-text-2); white-space: nowrap; }
    /* less room between the left column's parts; the right column as tall as the left */
    .c-side { gap: 14px; }
    .c-side .c-section h2 { margin-bottom: 10px; }
    .c-cols { align-items: stretch; }
    .c-cols > .c-section { display: flex; flex-direction: column; }
    .c-cols > .c-section > .c-grid { flex: 1; grid-auto-rows: 1fr; }
    @media (max-width: 1100px) { .c-cols { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 560px) { .c-item { flex-wrap: wrap; } .c-val { width: 100%; justify-content: flex-start; padding-inline-start: 0; } }
  </style>
</head>
<body class="a-body" data-page="coins">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>הגדרות מטבעות</h1>
        <p>כמה מטבעות התלמידים צוברים על כל דבר באתר, וכמה עולה אות בחנות.</p>
      </div>
    </div>

    <div class="a-note" style="margin-bottom:24px">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      <p>השינויים חלים מרגע השמירה, על פעולות חדשות בלבד. מטבעות שהילדים כבר צברו לא משתנים.</p>
    </div>

    <div class="c-cols" id="c-box">
      <section class="c-section" aria-labelledby="earn-title">
        <h2 id="earn-title">צבירת מטבעות</h2>
        <ul class="c-grid" id="c-earn"></ul>
      </section>
      <div class="c-side">
        <section class="c-section" aria-labelledby="shop-title">
          <h2 id="shop-title">בחנות האותיות</h2>
          <ul class="c-grid" id="c-shop"></ul>
        </section>
        <section class="c-section" aria-labelledby="review-title">
          <h2 id="review-title">חזרות</h2>
          <ul class="c-grid" id="c-chest"></ul>
        </section>
        <section class="c-section" aria-labelledby="streak-title">
          <h2 id="streak-title">התמדה</h2>
          <ul class="c-grid" id="c-streak"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261109i"></script>
  <script>
    (function () {
      const { Coins, UI } = window.Admin;
      let saved = Coins.load();
      let cur = { ...saved };
      const row = ([k, title, desc, , icon, unit]) => `<li class="c-item">
          <span class="c-icon" aria-hidden="true">${icon}</span>
          <div class="c-text"><b>${title}</b><span>${desc}</span></div>
          <div class="c-val">${UI.stepperHtml(`c-${k}`, cur[k], title, 0, 1000)}<span class="c-unit">${unit || 'מטבעות'}</span></div>
        </li>`;
      const draw = () => {
        // the chest goes under 'חזרות' and the daily streak under 'התמדה' (the left column)
        const SIDE = ['chest', 'streak'];
        document.getElementById('c-earn').innerHTML = Coins.defs.earn.filter(([k]) => !SIDE.includes(k)).map(row).join('');
        document.getElementById('c-chest').innerHTML = Coins.defs.earn.filter(([k]) => k === 'chest').map(row).join('');
        document.getElementById('c-streak').innerHTML = Coins.defs.earn.filter(([k]) => k === 'streak').map(row).join('');
        document.getElementById('c-shop').innerHTML = Coins.defs.shop.map(row).join('');
      };
      draw();
      const bar = UI.saveBar({
        onSave: () => { saved = { ...cur }; Coins.save(saved); },
        onCancel: () => { cur = { ...saved }; draw(); refresh(); },
      });
      document.querySelector('.a-head').appendChild(bar.el);
      const dirty = () => Object.keys(cur).some((k) => cur[k] !== saved[k]);
      const refresh = UI.wireSteppers(document.getElementById('c-box'), (id, v) => { cur[id.slice(2)] = v; bar.setDirty(dirty()); });
    })();
  </script>
</body>
</html>
