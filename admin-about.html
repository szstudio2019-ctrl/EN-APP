<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>עריכת אודות – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">

<body class="a-body" data-page="content" data-sub="about">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>אודות</h1>
        <p>עמוד "אודות" באתר: מי עומדת מאחורי האתר, הציטוט והשיטה.</p>
      </div>
    </div>
    <div class="a-note" style="margin-bottom:24px">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      <p>בשלב הזה השינויים נשמרים בדפדפן הזה בלבד. כשהאתר יחובר לשרת, הם יופיעו לכל התלמידים.</p>
    </div>
    <div class="t-layout">
      <div class="t-form" id="t-form"></div>
      <aside class="t-side a-card" aria-label="תצוגה מקדימה">
        <div id="t-preview"></div>
      </aside>
    </div>
  </main>
  <script>
    window.TEXT_PAGE = {
      key: 'about',
      defaults: {
        kicker: 'מי עומדת מאחורי מדקדקים באנגלית',
        name: 'ד"ר עינת ודעי רונן',
        role: 'מייסדת השיטה · קרוב ל-30 שנות הוראה',
        p1: 'עינת מביאה איתה ניסיון של קרוב ל-30 שנה ומחויבות בלתי מתפשרת לאיכות. אבל מעבר לתארים ולניסיון, היא קודם כל מורה בלב ובנפש. האהבה שלה להוראה החלה כמש"קית הוראה בבסיס מחווה אלון, שם גילתה את השילוב המנצח שבין שיטות לימוד ייחודיות, קשר אישי ומשמעת.',
        p2: 'מתוך התשוקה הזו היא בוחרת להישאר תמיד "בשטח", בתוך הכיתה, כי היא פשוט אוהבת ללמד. היא שומרת על קשר אישי וארוך טווח עם התלמידים שלה, גם הרבה אחרי שהם מסיימים ללמוד.',
        quote: '"אין תלמיד שלא יכול, יש רק תלמיד שלא ניסה מספיק פעמים."',
        cite: '– ד"ר עינת ודעי רונן',
        mTitle: 'השיטה',
        mLead: 'עינת וצוות המורים שלה מפתחים תוכניות לימוד ושיטות מיוחדות שמתמקדות בנקודות התורפה של דוברי העברית, כשהמטרה היא להפוך את הכללים המורכבים ביותר לפשוטים ונגישים.',
        photo: 'assets/team-einat.webp',
        bg: 'assets/bg-clouds.webp',
        cards: [
          { pic: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232A2577%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%3Cpath%20d%3D%22M8.5%2014.5c1%201.3%202.2%202%203.5%202s2.5-.7%203.5-2%22%2F%3E%3Cpath%20d%3D%22M9%209.5h.01M15%209.5h.01%22%2F%3E%3C%2Fsvg%3E', title: 'לכל אות יש דמות', text: 'האות a היא הרופאה שאומרת לאות שלפניה להגיד "אָה". כללים מסובכים הופכים לסיפור שזוכרים.' },
          { pic: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232A2577%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%205h16v11H9l-5%204z%22%2F%3E%3Cpath%20d%3D%22M8%2010h8M8%2013h5%22%2F%3E%3C%2Fsvg%3E', title: 'בנוי לדוברי עברית', text: 'השיעורים מתמקדים בדיוק במקומות שבהם דוברי עברית מתבלבלים, צעד אחר צעד.' },
          { pic: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232A2577%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3%2015h18l-3%203.5H6z%22%2F%3E%3Cpath%20d%3D%22M12%2015V8%22%2F%3E%3Cpath%20d%3D%22M12%208c-1.5-2-4-2.3-5.5-1.2M12%208c1.5-2%204-2.3%205.5-1.2M12%208c-.6-2.2.4-4%202-4.8%22%2F%3E%3C%2Fsvg%3E', title: 'לומדים דרך משחק', text: 'איים, מטבעות, תיבות אוצר ומשפט סודי. כל שיעור מקדם את הילד במסע.' },
          { pic: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232A2577%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%203l2.7%205.6%206.1.8-4.5%204.2%201.1%206.1L12%2016.8%206.6%2019.7l1.1-6.1L3.2%209.4l6.1-.8z%22%2F%3E%3C%2Fsvg%3E', title: 'לא מוותרים', text: 'חזרות קבועות ותרגול בקול רם, עד שכל אות וכל צליל יושבים בביטחון.' },
        ],
      },
      sections: [
        { id: 'look', title: 'תמונות', fields: [
          { key: 'photo', label: 'התמונה של עינת', image: true, help: 'תמונה מרובעת · JPG או WEBP' },
          { key: 'bg', label: 'תמונת הרקע של העמוד (העננים)', image: true, wide: true, help: 'תמונה רחבה, 1920×1080 · JPG או WEBP' }] },
        { id: 'who', title: 'מי עומדת מאחורי האתר', fields: [
          { key: 'kicker', label: 'שורה מעל השם', wide: true }, { key: 'name', label: 'השם' }, { key: 'role', label: 'התפקיד' },
          { key: 'p1', label: 'פסקה ראשונה', long: true }, { key: 'p2', label: 'פסקה שנייה', long: true }] },
        { id: 'quote', title: 'הציטוט', fields: [{ key: 'quote', label: 'הציטוט', long: true }, { key: 'cite', label: 'מי אמר/ה' }] },
        { id: 'method', title: 'השיטה', fields: [{ key: 'mTitle', label: 'כותרת' }, { key: 'mLead', label: 'פסקת פתיחה', long: true }] },
        { list: 'cards', title: 'כרטיסי השיטה', itemName: 'כרטיס',
          fields: [{ key: 'pic', label: 'אייקון', image: true, help: 'אייקון בקו דק · SVG, PNG או WEBP' }, { key: 'title', label: 'כותרת' }, { key: 'text', label: 'טקסט', long: true }] },
      ],
      preview: (d, esc) => `<div class="pv-about pv-about--plain">
          <div class="pv-about__bg"${d.bg ? ` style="background-image:url('${d.bg}')"` : ''}><span>רקע העמוד</span></div>
          <div class="pv-about__hero">
            ${d.photo ? `<img class="pv-about__photo" src="${d.photo}" alt="">` : ''}
            <div>
              <p class="pv-about__kicker">${esc(d.kicker)}</p>
              <p class="pv-about__name">${esc(d.name)}</p>
              <p class="pv-about__role">${esc(d.role)}</p>
            </div>
          </div>
          <p>${esc(d.p1)}</p><p>${esc(d.p2)}</p>
          <blockquote>${esc(d.quote)}<cite>${esc(d.cite)}</cite></blockquote>
          <p class="pv-about__name" style="font-size:20px">${esc(d.mTitle)}</p>
          <p>${esc(d.mLead)}</p>
          <div class="pv-about__cards">${d.cards.map((c) => `<div>${c.pic ? `<img class="pv-about__ic" src="${c.pic}" alt="">` : esc(c.icon || '')}<b>${esc(c.title)}</b>${esc(c.text)}</div>`).join('')}</div>
        </div>`,
    };
  </script>
  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261108v"></script>
  <script src="admin-texts.js?v=20261108v"></script>
</body>
</html>
