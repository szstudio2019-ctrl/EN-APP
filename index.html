<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מדקדקים באנגלית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Rubik:wght@400;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewport">
    <!-- Full-window background (outside the scaled stage so it covers the side bars too) -->
    <video class="bg" src="assets/bg-video.webm" muted loop playsinline preload="auto" aria-hidden="true"></video>
    <main class="stage" id="stage">

      <!-- Header -->
      <header class="topbar">
        <div class="topbar__stats">
          <a class="stat stat--chest" href="#bonus">
            <img src="assets/chest.webp" alt="" class="stat__icon stat__icon--chest">
            <span class="stat__text"><span class="stat__label">חזרות</span><span class="stat__value">3</span></span>
          </a>
          <a class="stat stat--coins" href="#coins">
            <img src="assets/coin.webp" alt="" class="stat__icon stat__icon--coin">
            <span class="stat__text"><span class="stat__label">מטבעות</span><span class="stat__value">350</span></span>
          </a>
          <a class="stat stat--shop" href="#shop">
            <img src="assets/shop.webp" alt="" class="stat__icon stat__icon--shop">
            <span class="stat__text"><span class="stat__label">חנות</span><span class="stat__value">12</span></span>
          </a>
        </div>

        <a class="logo" href="#" aria-label="מדקדקים באנגלית – קורס דיגיטלי באנגלית">
          <span class="logo__text">
            <span class="logo__title">מדקדקים באנגלית</span>
            <span class="logo__subtitle">קורס דיגיטלי באנגלית</span>
          </span>
          <span class="logo__mark">
            <img class="logo__ring" src="assets/logo-ring.svg" alt="">
            <span class="logo__tile logo__tile--a">a</span>
            <span class="logo__tile logo__tile--c">c</span>
            <span class="logo__tile logo__tile--b">b</span>
          </span>
        </a>

        <div class="topbar__user">
          <div class="user">
            <p class="user__greeting"><span class="user__hello">בקר טוב,</span><span class="user__name">שירה כהן</span></p>
            <a class="user__avatar" href="#profile" aria-label="הפרופיל שלי">
              <img class="user__ring" src="assets/avatar-ring.svg" alt="">
              <img class="user__photo" src="assets/avatar.webp" alt="">
              <span class="user__edit"><img src="assets/avatar-badge.svg" alt=""></span>
            </a>
          </div>
          <button class="menu-btn" type="button" aria-label="תפריט">
            <img src="assets/menu.svg" alt="">
          </button>
        </div>
      </header>

      <!-- Island journey: built by script.js from the ISLANDS list. One island is active
           (front, centre); the next ones wait small and locked toward the horizon.
           Scroll / swipe / arrow keys move along the path. -->
      <div class="journey" id="journey" aria-live="polite"></div>
      <nav class="journey-nav" aria-label="ניווט בין האיים">
        <button class="journey-nav__btn" id="journey-prev" type="button" aria-label="האי הקודם">
          <img src="assets/chevron.svg" alt="">
        </button>
        <span class="journey-nav__count" id="journey-count"></span>
        <button class="journey-nav__btn journey-nav__btn--next" id="journey-next" type="button" aria-label="האי הבא">
          <img src="assets/chevron.svg" alt="">
        </button>
      </nav>

      <!-- Bottom-left helper -->
      <img class="trophy" src="assets/trophy.svg" alt="">
      <a class="cart" href="#shop" aria-label="חנות האותיות" aria-describedby="shop-hint"><img src="assets/shop.webp" alt=""></a>
      <div class="hint" id="shop-hint" role="tooltip">
        <p class="hint__text">תוכלו לקנות אותיות בחנות האותיות ולנסות לנחש את המשפט שהמערכת הגרילה לכם</p>
        <a class="btn-pill hint__cta" href="#shop">
          <img src="assets/chevron.svg" alt="" class="btn-pill__chevron">
          <span>לחנות האותיות</span>
        </a>
      </div>
      <button class="help-btn" type="button" aria-label="עזרה">?</button>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
