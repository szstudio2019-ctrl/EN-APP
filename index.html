<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מדקדקים באנגלית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewport">
    <main class="stage" id="stage">
      <img class="bg" src="assets/bg-clouds.webp" alt="">

      <!-- Header -->
      <header class="topbar">
        <div class="topbar__stats">
          <a class="stat stat--chest" href="#bonus">
            <img src="assets/chest.webp" alt="" class="stat__icon stat__icon--chest">
            <span class="stat__text"><span class="stat__label">חזרות</span><span class="stat__value">3</span></span>
          </a>
          <a class="stat stat--coins" href="#coins">
            <img src="assets/coin.webp" alt="" class="stat__icon stat__icon--coin">
            <span class="stat__text"><span class="stat__label">מטבעות</span><span class="stat__value">350</span></span>
          </a>
          <a class="stat stat--shop" href="#shop">
            <img src="assets/shop.webp" alt="" class="stat__icon stat__icon--shop">
            <span class="stat__text"><span class="stat__label">חנות</span><span class="stat__value">12</span></span>
          </a>
        </div>

        <a class="logo" href="#" aria-label="מדקדקים באנגלית – קורס דיגיטלי באנגלית">
          <span class="logo__text"><img src="assets/logo-text.webp" alt=""></span>
          <span class="logo__mark">
            <img class="logo__ring" src="assets/logo-ring.svg" alt="">
            <span class="logo__tile logo__tile--a">a</span>
            <span class="logo__tile logo__tile--c">c</span>
            <span class="logo__tile logo__tile--b">b</span>
          </span>
        </a>

        <div class="topbar__user">
          <div class="user">
            <p class="user__greeting"><span class="user__hello">בקר טוב,</span><span class="user__name">שירה כהן</span></p>
            <a class="user__avatar" href="#profile" aria-label="הפרופיל שלי">
              <img class="user__ring" src="assets/avatar-ring.svg" alt="">
              <img class="user__photo" src="assets/avatar.webp" alt="">
              <span class="user__edit"><img src="assets/avatar-badge.svg" alt=""></span>
            </a>
          </div>
          <button class="menu-btn" type="button" aria-label="תפריט">
            <img src="assets/menu.svg" alt="">
          </button>
        </div>
      </header>

      <!-- Islands -->
      <a class="island island--doctor" data-state="current" href="#island-doctor">
        <img class="island__img" src="assets/island-doctor.webp" alt="">
        <div class="island__card">
          <p class="island__title">אי אותיות של רופא/ה</p>
          <div class="island__stats">
            <p class="island__stat"><span>שיעורים</span><b>2-4</b></p>
            <div class="island__coins">
              <img src="assets/coin.webp" alt="">
              <p class="island__stat"><span>מטבעות</span><b>350</b></p>
            </div>
          </div>
          <div class="island__progress" role="progressbar" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100"><span style="width:41.98%"></span></div>
        </div>
      </a>

      <a class="island island--smiles" data-state="locked" href="#island-smiles" aria-disabled="true">
        <img class="island__img" src="assets/island-smiles.webp" alt="">
        <span class="island__lock" aria-label="נעול">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <div class="island__card">
          <p class="island__title">אותיות של מחייכות</p>
          <div class="island__stats">
            <p class="island__stat"><span>שיעורים</span><b>2-4</b></p>
            <div class="island__coins">
              <img src="assets/coin.webp" alt="">
              <p class="island__stat"><span>מטבעות</span><b>350</b></p>
            </div>
          </div>
          <div class="island__progress"><span style="width:41.98%"></span></div>
        </div>
      </a>

      <a class="island island--abc" data-state="available" href="#island-abc">
        <img class="island__img" src="assets/island-abc.webp" alt="">
        <div class="island__card">
          <p class="island__title">אי אותיות של רופא/ה</p>
          <div class="island__stats">
            <p class="island__stat"><span>שיעורים</span><b>2-4</b></p>
            <div class="island__coins">
              <img src="assets/coin.webp" alt="">
              <p class="island__stat"><span>מטבעות</span><b>350</b></p>
            </div>
          </div>
          <div class="island__progress"><span style="width:41.98%"></span></div>
        </div>
      </a>

      <!-- Bottom-left helper -->
      <img class="trophy" src="assets/trophy.svg" alt="">
      <div class="hint">
        <p class="hint__text">תוכלו לקנות אותיות בחנות האותיות ולנסות לנחש את המשפט שהמערכת הגרילה לכם</p>
        <a class="btn-pill hint__cta" href="#shop">
          <img src="assets/chevron.svg" alt="" class="btn-pill__chevron">
          <span>לחנות האותיות</span>
        </a>
      </div>
      <a class="cart" href="#shop" aria-label="חנות האותיות"><img src="assets/shop.webp" alt=""></a>
      <button class="help-btn" type="button" aria-label="עזרה">?</button>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
