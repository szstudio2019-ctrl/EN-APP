<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>הפרטים שלי – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261122o">
</head>
<body class="a-body" data-page="me">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>הפרטים שלי</h1>
        <p>הפרטים של מנהלת המערכת: השם והתמונה שמופיעים בתפריט, ופרטי הקשר.</p>
      </div>
    </div>

    <section class="a-card me-card" aria-label="עריכת הפרטים שלי">
      <div class="me-photo">
        <label class="me-photo__pic" for="me-file" aria-label="החלפת התמונה"><img id="me-img" src="assets/team-einat.webp" alt=""></label>
        <div class="me-photo__btns">
          <label class="a-btn a-btn--ghost" for="me-file">החלפת תמונה</label>
          <small class="a-help">PNG או WEBP · תמונה מרובעת נראית הכי טוב</small>
        </div>
        <input id="me-file" type="file" accept="image/*" class="sr-only">
      </div>
      <div class="a-grid me-grid">
        <label class="a-field"><span>שם פרטי</span><input id="me-first" autocomplete="given-name"></label>
        <label class="a-field"><span>שם משפחה</span><input id="me-last" autocomplete="family-name"></label>
        <label class="a-field"><span>אימייל</span><input id="me-email" type="email" dir="ltr" autocomplete="email"></label>
        <label class="a-field"><span>טלפון</span><input id="me-phone" type="tel" dir="ltr" autocomplete="tel"></label>
        <label class="a-field a-wide"><span>תפקיד</span><input id="me-role"></label>
      </div>
    </section>
  </main>

  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261122m"></script>
  <script>
    (function () {
      const { UI, Me } = window.Admin;
      const $ = (id) => document.getElementById(id);
      const FIELDS = { first: 'me-first', last: 'me-last', email: 'me-email', phone: 'me-phone', role: 'me-role' };
      let saved = Me.load();
      let cur = { ...saved };
      const fill = () => {
        Object.entries(FIELDS).forEach(([k, id]) => { $(id).value = cur[k] || ''; });
        $('me-img').src = cur.photo || 'assets/team-einat.webp';
      };
      const bar = UI.saveBar({
        onSave: () => { saved = { ...cur }; Me.save(saved); Me.paint(saved); },
        onCancel: () => { cur = { ...saved }; fill(); },
      });
      document.querySelector('.a-head').appendChild(bar.el);
      const changed = () => bar.setDirty(JSON.stringify(cur) !== JSON.stringify(saved));
      Object.entries(FIELDS).forEach(([k, id]) => $(id).addEventListener('input', (e) => { cur[k] = e.target.value; changed(); }));
      $('me-file').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f || !f.type.startsWith('image/')) return;
        const url = URL.createObjectURL(f);
        const img = new Image();
        img.onload = () => {
          const S = Math.min(240, img.width, img.height);
          const c = document.createElement('canvas'); c.width = S; c.height = S;
          const side = Math.min(img.width, img.height);
          c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
          cur.photo = c.toDataURL('image/webp', 0.85);
          URL.revokeObjectURL(url);
          fill(); changed();
        };
        img.src = url;
      });
      fill();
    })();
  </script>
</body>
</html>
