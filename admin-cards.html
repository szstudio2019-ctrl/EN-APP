<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>עריכת כרטיסיות בחנות – ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin-ui.css?v=20261123k">
  <link rel="stylesheet" href="admin-edit.css?v=20261123g">
</head>
<body class="a-body" data-page="content" data-sub="cards">
  <main class="a-main">
    <div class="a-head">
      <div>
        <h1>כרטיסיות בחנות</h1>
        <p>כרטיסיות האותיות בחנות האותיות: התמונה של כל אות, ואם היא נמכרת בחנות.</p>
      </div>
      <!-- the count, on the left opposite the title, in two lines -->
      <div class="c-sumbox">
        <p class="c-sumbox__l1"><b>26 כרטיסיות</b> · <span id="c-sum"></span></p>
        <p class="c-sumbox__l2">מחיר כרטיסייה נקבע ב<a class="a-link" href="admin-coins.html">הגדרות המטבעות</a></p>
      </div>
    </div>
    <section class="a-card c-wrap">
      <div class="c-cards" id="c-cards"></div>
    </section>
  </main>
  <script src="islands.js"></script>
  <script src="admin-shell.js?v=20261122w"></script>
  <script>
    (function () {
      const { UI } = window.Admin;
      const KEY = 'en-app:admin-cards';
      const ABC = 'abcdefghijklmnopqrstuvwxyz'.split('');
      const base = () => Object.fromEntries(ABC.map((l) => [l, { on: true, img: '' }]));
      let saved;
      try { saved = Object.assign(base(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { saved = base(); }
      let cur = JSON.parse(JSON.stringify(saved));
      const box = document.getElementById('c-cards');
      const draw = () => {
        box.innerHTML = ABC.map((l) => {
          const c = cur[l];
          return `<div class="c-card${c.on ? '' : ' is-off'}">
            <div class="c-card__art"><img src="${c.img || `assets/cards/card-${l}.webp`}" alt="כרטיסיית האות ${l}"></div>
            <div class="c-card__row"><span class="c-card__letter" dir="ltr">${l.toUpperCase()} ${l}</span><span class="c-card__state">${c.on ? 'נמכרת בחנות' : 'מוסתרת מהחנות'}${c.img ? '<br>תמונה חדשה' : ''}</span></div>
            <div class="c-card__tools"><span class="c-tip">${UI.switchHtml(`c-on-${l}`, c.on, `האות ${l} נמכרת בחנות`)}<span class="c-tip__t" aria-hidden="true">${c.on ? 'מוצגת בחנות – לחיצה תסתיר אותה' : 'מוסתרת מהחנות – לחיצה תציג אותה'}</span></span>
              <label class="c-card__pic c-tip" for="c-img-${l}" aria-label="החלפת התמונה של האות ${l}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.5"/></svg><span class="c-tip__t" aria-hidden="true">החלפת התמונה</span></label>
              <input id="c-img-${l}" data-img="${l}" type="file" accept="image/*" class="sr-only"></div>
          </div>`;
        }).join('');
        document.getElementById('c-sum').textContent = `${ABC.filter((l) => cur[l].on).length} נמכרות בחנות`;
      };
      const bar = UI.saveBar({
        onSave: () => { saved = JSON.parse(JSON.stringify(cur)); try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { alert('אין מספיק מקום בדפדפן לשמירת התמונות'); } },
        onCancel: () => { cur = JSON.parse(JSON.stringify(saved)); draw(); },
      });
      bar.mount();
      const changed = () => bar.setDirty(JSON.stringify(cur) !== JSON.stringify(saved));
      box.addEventListener('change', (e) => {
        const t = e.target;
        if (t.id && t.id.startsWith('c-on-')) { const l = t.id.slice(5); cur[l].on = t.checked; draw(); changed(); document.getElementById(t.id).focus(); return; }
        if (t.dataset.img) {
          const f = t.files && t.files[0];
          if (!f || !f.type.startsWith('image/')) return;
          const url = URL.createObjectURL(f);
          const img = new Image();
          img.onload = () => {
            const W = Math.min(360, img.width), H = Math.round(img.height * (W / img.width));
            const c = document.createElement('canvas'); c.width = W; c.height = H;
            c.getContext('2d').drawImage(img, 0, 0, W, H);
            cur[t.dataset.img].img = c.toDataURL('image/webp', 0.85);
            URL.revokeObjectURL(url); draw(); changed();
          };
          img.src = url;
        }
      });
      draw();
    })();
  </script>
</body>
</html>
